name: iPhone build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphone:
    name: Unsigned iPhone IPA
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build for physical iPhone
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project LivePhotoStudio.xcodeproj -scheme LivePhotoStudio \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/studio-device" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Verify and package the unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/studio-device/Build/Products/Release-iphoneos/LivePhotoStudio.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          xcrun lipo "$app/$executable" -verify_arch arm64
          build_version=$(xcrun vtool -show-build "$app/$executable")
          printf '%s\n' "$build_version"
          grep -Eiq 'platform[[:blank:]]+ios[[:space:]]*$' <<< "$build_version"
          if codesign -d "$app/$executable" 2>/dev/null; then
            codesign --remove-signature "$app/$executable"
          fi
          test ! -e "$app/embedded.mobileprovision"
          test ! -e "$app/_CodeSignature"
          if codesign -d "$app/$executable" 2>/dev/null; then
            echo "The executable is still signed" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/studio-ipa/Payload" "$RUNNER_TEMP/studio-artifacts"
          ditto "$app" "$RUNNER_TEMP/studio-ipa/Payload/LivePhotoStudio.app"
          ipa="$RUNNER_TEMP/studio-artifacts/LivePhotoStudio.ipa"
          ditto -c -k --keepParent "$RUNNER_TEMP/studio-ipa/Payload" "$ipa"
          unzip -tq "$ipa"
          entries=$(unzip -Z1 "$ipa")
          grep -Fx "Payload/LivePhotoStudio.app/$executable" <<< "$entries"
          grep -Fx 'Payload/LivePhotoStudio.app/Info.plist' <<< "$entries"

      - uses: actions/upload-artifact@v6
        with:
          name: LivePhotoStudio
          path: ${{ runner.temp }}/studio-artifacts/LivePhotoStudio.ipa
          if-no-files-found: error
          compression-level: 0

  tests:
    name: Live Photo media tests
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Select the iPhone simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-devices.json"
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-platform-version)
          device=$(python3 - "$RUNNER_TEMP/ios-devices.json" "$sdk" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as source:
              runtimes = json.load(source)["devices"]
          sdk = tuple(map(int, sys.argv[2].split(".")))
          ios = {tuple(map(int, key.split(".iOS-")[1].split("-"))): devices
                 for key, devices in runtimes.items() if ".iOS-" in key}
          for version in sorted(ios, reverse=True):
              if version[:2] > sdk[:2]:
                  continue
              iphone = next((device for device in ios[version] if device["name"].startswith("iPhone")), None)
              if iphone:
                  print(iphone["udid"])
                  break
          else:
              sys.exit("No available iPhone simulator")
          PY
          )
          printf 'TEST_DEVICE=%s\n' "$device" >> "$GITHUB_ENV"

      - name: Build the simulator and test targets
        run: |
          xcodebuild -project LivePhotoStudio.xcodeproj -scheme LivePhotoStudio \
            -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$TEST_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/studio-simulator" build-for-testing

      - name: Boot the iPhone simulator
        timeout-minutes: 6
        run: xcrun simctl bootstatus "$TEST_DEVICE" -b

      - name: Run the conversion tests on the booted simulator
        timeout-minutes: 8
        run: |
          xcodebuild -project LivePhotoStudio.xcodeproj -scheme LivePhotoStudio \
            -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$TEST_DEVICE" \
            -derivedDataPath "$RUNNER_TEMP/studio-simulator" -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 test-without-building
